<!DOCTYPE html>
<html lang="ru" data-theme="wood">
  <head>
    <meta charset="UTF-8" />
    <!-- no pinch/double-tap zoom: the board is a drag surface, and an
         accidental two-finger or double-tap zoom mid-word leaves the app
         scaled with no way back (the page itself never scrolls on phones).
         maximum-scale/user-scalable cover Android and the installed
         standalone app; iOS Safari in a browser tab ignores them, so the
         gesture listeners in main.tsx close that gap -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- the chrome color always matches the page background: these tags start
         at the default theme's chrome (the page ships data-theme='wood'),
         and once the app runs App.tsx re-points them at the active board
         theme, so the bar reads as the page continuing behind it at every
         moment. Two media variants carrying the same color: in the installed
         standalone app Chrome ignores a scheme-less tag outright when
         Android's dark mode is on (Chromium 40634649) — with a matching
         variant present it keeps reading the color from the page. The
         manifest's theme_color/background_color carry the same value (the
         splash and the pre-paint header share it); the manifest cannot vary
         it by scheme — theme_color is a single static string (the
         media-array form from w3c/manifest#975 was never standardized) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7d9bd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#e7d9bd" />
    <title>Балда (игра)</title>
    <!-- the installable-app route to a fullscreen phone experience: added to
         the home screen, the game launches standalone, with no address bar.
         A plain page in a browser tab cannot hide the bar itself -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Балда" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Play&family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
