<!DOCTYPE html>
<html lang="ru" data-theme="wood">
  <head>
    <meta charset="UTF-8" />
    <!-- no pinch/double-tap zoom: the board is a drag surface, and an
         accidental two-finger or double-tap zoom mid-word leaves the app
         scaled with no way back (the page itself never scrolls on phones).
         maximum-scale/user-scalable cover Android and the installed
         standalone app; iOS Safari in a browser tab ignores them, so the
         gesture listeners in main.tsx close that gap -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- the chrome color always matches the page background: the tag starts
         at the default theme's chrome (the page ships data-theme='wood'),
         and once the app runs App.tsx re-points it at the active board
         theme, so the bar reads as the page continuing behind it at every
         moment. One scheme-less tag, deliberately: a light/dark media pair
         was tried (to dodge the standalone dark-mode bug, Chromium 40634649
         — a scheme-less tag is ignored there and the bar falls back to the
         manifest's static color) but it killed the live recoloring on
         Android — with the pair the bar stopped following theme switches,
         with the single tag it always has. The manifest's
         theme_color/background_color carry the same first-paint value (the
         splash and the pre-paint header share it), and the manifest color is
         also what a dark-mode standalone build shows instead of this tag -->
    <meta name="theme-color" content="#e7d9bd" />
    <title>Балда (игра)</title>
    <!-- the installable-app route to a fullscreen phone experience: added to
         the home screen, the game launches standalone, with no address bar.
         A plain page in a browser tab cannot hide the bar itself -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Балда" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Play&family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
