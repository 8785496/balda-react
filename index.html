<!DOCTYPE html>
<html lang="ru" data-theme="neon">
  <head>
    <meta charset="UTF-8" />
    <!-- no pinch/double-tap zoom: the board is a drag surface, and an
         accidental two-finger or double-tap zoom mid-word leaves the app
         scaled with no way back (the page itself never scrolls on phones).
         maximum-scale/user-scalable cover Android and the installed
         standalone app; iOS Safari in a browser tab ignores them, so the
         gesture listeners in main.tsx close that gap -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- the launch chrome color (matches the splash/icon identity); once the
         app runs, App.tsx re-points these tags at the active board theme, so
         the browser chrome follows the theme switcher. Two media variants:
         Chrome prefers the tag matching the system scheme, and in the
         installed standalone app it ignores a scheme-less tag outright when
         Android's dark mode is on (Chromium 40634649) — with both variants
         present it keeps reading the theme color from the page instead of
         falling back to the manifest's static value -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#8a5a2b" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#8a5a2b" />
    <title>Балда (игра)</title>
    <!-- the installable-app route to a fullscreen phone experience: added to
         the home screen, the game launches standalone, with no address bar.
         A plain page in a browser tab cannot hide the bar itself -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Балда" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Play&family=Open+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
